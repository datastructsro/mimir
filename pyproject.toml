[project]
name = "mimir"
version = "0.3.0"
description = "Warehouse-scoped replenishment review client for Parqcast exports and Odoo 18/19"
authors = [
    { name = "DataStruct s.r.o.", email = "info@datastruct.tech" }
]
requires-python = "==3.12.3"
dependencies = [
    "pyarrow>=18.0",
    "openpyxl>=3.1",
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://datastruct.tech"
Repository = "https://github.com/datastructsro/mimir"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["odoo_addon/mimir_core"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
include = ["odoo_addon/mimir_core"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
reportMissingImports = "warning"
reportUnknownMemberType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyarrow-stubs>=20",
    "pyright>=1.1.408",
    "pytest>=9.0.3",
    "ruff>=0.8",
    "types-openpyxl>=3.1",
    "numpy>=2.0",
]
