[project]
name = "foreqcast"
version = "0.3.0"
description = "Linear regression demand forecaster — reads parqcast parquet exports, projects demand, writes replenishment rules back to Odoo 18/19"
authors = [
    { name = "DataStruct s.r.o.", email = "info@datastruct.tech" }
]
requires-python = "==3.12.3"
dependencies = [
    "pyarrow>=18.0",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "boto3>=1.34",
]

[project.urls]
Homepage = "https://datastruct.tech"
Repository = "https://github.com/datastructsro/foreqcast"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
foreqcast = "foreqcast.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreqcast"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
