[project]
name = "foreqcast-server"
version = "0.1.0"
description = "Reference implementation — minimal forecast server that authenticates and serves forecast Parquet files"
authors = [
    { name = "DataStruct s.r.o.", email = "info@datastruct.tech" }
]
requires-python = "==3.12.3"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pyarrow>=18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[project.scripts]
foreqcast-server = "foreqcast_server.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foreqcast_server"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
include = ["src/foreqcast_server"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
